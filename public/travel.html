<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="travel.css"> <!-- Your external CSS -->
</head>
<body class="bg-white text-dark">
  <div class="container my-5">

    <!-- Header Card -->
    <div class="card mb-4 bg-danger text-white">
      <div class="card-body d-flex justify-content-between flex-wrap">
        <div><strong>Employee Name:</strong> <span id="headerName">Loading...</span></div>
        <div><strong>HR Mantra ID:</strong> <span id="headerEmpId">Loading...</span></div>
      </div>
    </div>

    <div class="text-center mb-4">
      <img src="https://res.cloudinary.com/dpfpzqyno/image/upload/v1753422983/image_v4fkld.png" alt="Travel Logo" class="img-fluid" style="max-height: 120px;">
    </div>

    <!-- Centered Title -->
    <div class="text-center mb-4">
      <h2 class="text-black">Travel Details Form</h2>
    </div>

    <!-- Form Start -->
    <form id="travelForm">

      <!-- Department Dropdown -->
      <div class="mb-3">
        <label class="form-label">Department <span class="text-danger">*</span></label>
        <select class="form-select" name="department" required>
          <option value="">Select Department</option>
          <option>HR</option>
          <option>Finance</option>
          <option>Operations</option>
          <option>Sales</option>
          <option>IT</option>
        </select>
      </div>

      <!-- Travel Entries Section -->
      <div id="travelEntries">
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between align-items-center mt-4">
        <div></div>
        <button type="button" id="addEntry" class="btn btn-success">Add Another Travel Entry</button>
      </div>

      <!-- Submit Button Centered -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-5">Submit</button>
      </div>

    </form>
  </div>

  <div class="loading-indicator" id="loadingIndicator"></div>

  <script src="travel.js"></script>
</body>
</html>
