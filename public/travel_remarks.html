<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="travel_remarks.css"> <!-- Your external CSS -->
</head>
<body class="bg-white text-dark">
  <div class="container my-5">

    <!-- Header Card -->
    <div class="card mb-4 bg-danger text-white">
      <div class="card-body d-flex justify-content-between flex-wrap">
        <div><strong>Employee Name:</strong> <span id="headerName">Loading...</span></div>
        <div><strong>HR Mantra ID:</strong> <span id="headerEmpId">Loading...</span></div>
      </div>
    </div>

    <div class="text-center mb-4">
      <img src="https://res.cloudinary.com/dpfpzqyno/image/upload/v1753422983/image_v4fkld.png" alt="Travel Logo" class="img-fluid" style="max-height: 120px;">
    </div>

    <!-- Centered Title -->
    <div class="text-center mb-4">
      <h2 class="text-black">Travel Remarks Form</h2>
    </div>

    <!-- Form Start -->
    <form id="travelremarksForm">

      <!-- Travel Status -->
      <div class="mb-3">
        <label class="form-label">Did the person travel? <span class="text-danger">*</span></label><br>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="didTravel" id="travelYes" value="Yes" required>
          <label class="form-check-label" for="travelYes">Yes</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="didTravel" id="travelNo" value="No" required>
          <label class="form-check-label" for="travelNo">No</label>
        </div>
      </div>

      <!-- Remarks Field -->
      <div class="mb-3">
        <label class="form-label">Remarks <span id="remarksStar" class="text-danger" style="display:none">*</span></label>
        <textarea class="form-control" id="remarks" name="remarks" rows="3" placeholder="Enter remarks if required"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-5">Submit</button>
      </div>

    </form>
  </div>

  <div class="loading-indicator" id="loadingIndicator"></div>

  <script src="travel_remarks.js"></script>
</body>
</html>
